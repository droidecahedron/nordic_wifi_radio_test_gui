#
# PyInstaller does not cross-compile, so each executable is built on its own
# runner. Nothing here touches hardware: the bench check needs a kit, so it stays
# a manual step. See tools/bench_check.py.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's offscreen platform still links EGL and xkbcommon on Linux. The
      # runners do not ship them, and the failure looks like a missing plugin.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests -v

  build:
    name: build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A PyInstaller binary links the build machine's glibc, so the
          # oldest supported runner reaches the most users. AppImage would not
          # change this; it bundles no libc either.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          # macos-14 and later are Apple silicon; macos-13 is the last Intel
          # runner. A universal2 binary needs a universal Python, so ship two
          # rather than pretend one covers both.
          - os: macos-14
            name: macos-arm64
          - os: macos-13
            name: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller nrf_radio_gui.spec --noconfirm

      # Proves the frozen bundle can still import its own modules and read the
      # firmware it shipped. Anything needing a kit cannot run here.
      - name: Smoke test the executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="dist/nrf-radio-test.exe"
          else
            exe="dist/nrf-radio-test"
          fi
          test -x "$exe" || { echo "no executable at $exe"; ls -R dist; exit 1; }
          "$exe" --version

      # A .app is a directory tree. upload-artifact would flatten its
      # permissions, so zip it first and keep the executable bit.
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) cp dist/nrf-radio-test.exe "out/nrf-radio-test-${{ matrix.name }}.exe" ;;
            macOS)   ditto -c -k --keepParent "dist/nrf-radio-test.app" \
                       "out/nrf-radio-test-${{ matrix.name }}.app.zip"
                     cp dist/nrf-radio-test "out/nrf-radio-test-${{ matrix.name }}" ;;
            Linux)   cp dist/nrf-radio-test "out/nrf-radio-test-${{ matrix.name }}" ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: nrf-radio-test-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          chmod +x release/* || true
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Download one file and run it. No clone, no Python, no venv.

            | platform | file | notes |
            | --- | --- | --- |
            | Windows | `nrf-radio-test-windows-x86_64.exe` | double-click |
            | macOS Apple silicon | `nrf-radio-test-macos-arm64.app.zip` | unzip, then right-click Open |
            | macOS Intel | `nrf-radio-test-macos-x86_64.app.zip` | unzip, then right-click Open |
            | Linux | `nrf-radio-test-linux-x86_64` | `chmod +x`, then run |

            `nrfutil` still has to be on PATH for kit enumeration and for the
            Flash button. Driving an already flashed kit needs only the port.

            Verify a download against a kit:

                nrf-radio-test --selftest --serial <SN>

            Unsigned, so the first launch is blocked. On macOS right-click and
            Open, or `xattr -d com.apple.quarantine <file>`. On Windows choose
            More info then Run anyway.

            The Linux binary links the glibc of its build runner, Ubuntu 22.04,
            so it needs 22.04 or newer.
