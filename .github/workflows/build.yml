#
# PyInstaller does not cross-compile, so each executable is built on its own
# runner. Nothing here touches hardware: the bench check needs a kit, so it stays
# a manual step. See tools/bench_check.py.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's offscreen platform still links EGL and xkbcommon on Linux. The
      # runners do not ship them, and the failure looks like a missing plugin.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover tests -v

  build:
    name: build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          # macos-14 and later are Apple silicon; macos-13 is the last Intel
          # runner. A universal2 binary needs a universal Python, so ship two
          # rather than pretend one covers both.
          - os: macos-14
            name: macos-arm64
          - os: macos-13
            name: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller nrf_radio_gui.spec --noconfirm

      # Proves the frozen bundle can still import its own modules and read the
      # firmware it shipped. Anything needing a kit cannot run here.
      - name: Smoke test the executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="dist/nrf-radio-test.exe"
          else
            exe="dist/nrf-radio-test"
          fi
          test -x "$exe" || { echo "no executable at $exe"; ls -R dist; exit 1; }
          "$exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: nrf-radio-test-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name each build after its platform
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            platform="$(basename "$dir" | sed 's/^nrf-radio-test-//')"
            for file in "$dir"*; do
              base="$(basename "$file")"
              case "$base" in
                *.exe) cp "$file" "release/${base%.exe}-${platform}.exe" ;;
                *)     cp "$file" "release/${base}-${platform}" ;;
              esac
            done
          done
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            Built by CI on each platform; PyInstaller does not cross-compile.

            These are not code-signed. macOS will refuse to open the download
            until it is cleared in System Settings > Privacy & Security, and
            SmartScreen will warn on Windows.

            Verify a download against a kit with:

                nrf-radio-test --selftest --serial <SN>
